<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>7초 충전 실행</title>
  <style>
    :root { color-scheme:dark; --cyan:#8ffcff; --blue:#26c9ff; --gold:#ffd77a; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#01050a; }
    body {
      color:#fff; font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
      background:radial-gradient(circle at 50% 48%,rgba(11,110,146,.25),transparent 32%),
                 radial-gradient(ellipse at 50% -10%,rgba(57,221,255,.28),transparent 38%),#01050a;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
      background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(126,240,255,.12) 6px);
      animation:scan 1.1s linear infinite;
    }
    #sequence { position:relative; width:100%; height:100%; animation:sequence 7s linear both; }
    #sequence::before {
      content:""; position:absolute; inset:0; opacity:.55;
      background-image:radial-gradient(circle,rgba(179,249,255,.9) 0 1px,transparent 1.5px),
                       radial-gradient(circle,rgba(255,215,122,.65) 0 1px,transparent 1.5px);
      background-position:0 0,31px 47px; background-size:83px 79px,117px 109px;
      animation:stars 7s ease-in both;
    }
    .arc {
      position:absolute; left:50%; width:145vw; height:34vh; transform:translateX(-50%);
      border:2px solid rgba(137,247,255,.9); border-radius:50%;
      box-shadow:0 0 12px var(--cyan),0 0 50px rgba(38,201,255,.55),inset 0 0 38px rgba(38,201,255,.22);
      animation:arc 7s ease-out both;
    }
    .arc.top { top:-27vh; }
    .arc.bottom { bottom:-27vh; }
    .message {
      position:absolute; inset:0; display:grid; place-content:center; padding:8vw;
      text-align:center; text-shadow:0 0 12px rgba(133,244,255,.9);
    }
    .eyebrow { color:var(--cyan); font:600 clamp(10px,2.8vw,17px)/1.5 monospace; letter-spacing:.34em; }
    .message h1 { margin:.35em 0 .2em; font-size:clamp(30px,8vw,68px); font-weight:500; letter-spacing:.07em; }
    .rule { width:min(68vw,520px); height:1px; margin:1.4rem auto; background:linear-gradient(90deg,transparent,var(--cyan),transparent); }
    .detect { animation:detect 7s ease both; }
    .execute { animation:execute 7s ease both; }
    .execute h1 { font-size:clamp(50px,14vw,105px); letter-spacing:.16em; }
    .execute h1::before { content:"["; color:var(--cyan); margin-right:.15em; }
    .execute h1::after { content:"]"; color:var(--cyan); }
    .system { position:absolute; inset:0; display:grid; place-items:center; animation:system 7s cubic-bezier(.2,.8,.2,1) both; }
    .sigil { position:relative; width:min(94vw,82vh); aspect-ratio:1; filter:drop-shadow(0 0 18px rgba(70,221,255,.7)); }
    .sigil::before,.sigil::after { content:""; position:absolute; inset:12%; border-radius:50%; pointer-events:none; }
    .sigil::before { border:1px solid var(--cyan); box-shadow:0 0 35px rgba(38,201,255,.75),inset 0 0 35px rgba(38,201,255,.45); animation:breathe .72s ease-in-out infinite alternate; }
    .sigil::after { inset:30%; background:radial-gradient(circle,#fff 0 2%,var(--cyan) 6%,rgba(38,201,255,.24) 24%,transparent 67%); animation:core .55s ease-in-out infinite alternate; }
    svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .cyan { fill:none; stroke:var(--cyan); }
    .gold { fill:none; stroke:var(--gold); }
    .outer { transform-origin:400px 400px; animation:ccw 4s linear infinite; }
    .middle { transform-origin:400px 400px; animation:cw 2.7s linear infinite; }
    .inner { transform-origin:400px 400px; animation:ccw 1.8s linear infinite; }
    .runes { fill:var(--gold); font:700 15px monospace; letter-spacing:7px; }
    .status {
      position:absolute; left:50%; bottom:9%; transform:translateX(-50%); width:92vw;
      color:var(--gold); text-align:center; font:600 clamp(11px,3vw,18px)/1.5 monospace;
      letter-spacing:.28em; text-shadow:0 0 10px rgba(255,215,122,.9);
    }
    .complete {
      position:absolute; inset:0; display:grid; place-content:center; text-align:center;
      font-size:clamp(26px,7vw,58px); letter-spacing:.12em; color:#fff;
      text-shadow:0 0 8px #fff,0 0 28px var(--gold); animation:complete 7s ease both;
    }
    .complete small { display:block; margin-top:1rem; color:var(--gold); font:600 clamp(10px,2.7vw,16px)/1.5 monospace; letter-spacing:.3em; }
    .flash { position:absolute; inset:0; background:#eaffff; mix-blend-mode:screen; pointer-events:none; animation:flash 7s ease-out both; }
    @keyframes detect { 0%{opacity:0;transform:scale(.96)} 5%,20%{opacity:1;transform:none} 26%,100%{opacity:0;transform:scale(1.03)} }
    @keyframes execute { 0%,25%{opacity:0;transform:scale(.7)} 30%,38%{opacity:1;transform:scale(1)} 43%,100%{opacity:0;transform:scale(1.18)} }
    @keyframes system { 0%,41%{opacity:0;transform:scale(.32) rotate(-12deg)} 47%{opacity:1;transform:scale(1)} 76%{opacity:1;transform:scale(1.03)} 83%{opacity:1;transform:scale(1.12)} 100%{opacity:0;transform:scale(1.48)} }
    @keyframes complete { 0%,81%{opacity:0;transform:scale(.7)} 87%,92%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.08)} }
    @keyframes flash { 0%,81%{opacity:0} 86%{opacity:.82} 91%{opacity:.08} 100%{opacity:0} }
    @keyframes sequence { 0%,96%{opacity:1} 100%{opacity:0} }
    @keyframes arc { 0%{opacity:0} 6%,82%{opacity:1} 100%{opacity:0;filter:blur(8px)} }
    @keyframes stars { 0%{transform:scale(1);opacity:.2} 83%{transform:scale(1.22);opacity:.75} 100%{transform:scale(1.55);opacity:0} }
    @keyframes scan { to{transform:translateY(6px)} }
    @keyframes cw { to{transform:rotate(360deg)} }
    @keyframes ccw { to{transform:rotate(-360deg)} }
    @keyframes breathe { to{transform:scale(1.06);opacity:.55} }
    @keyframes core { to{transform:scale(1.18);filter:brightness(1.5)} }
    @media (prefers-reduced-motion:reduce) { .outer,.middle,.inner,.sigil::before,.sigil::after { animation-duration:7s; } }
  </style>
</head>
<body>
  <main id="sequence" aria-label="충전 연결 애니메이션">
    <div class="arc top"></div><div class="arc bottom"></div>
    <section class="message detect">
      <div class="eyebrow">SYSTEM SIGNAL DETECTED</div>
      <h1>충전 단자가<br>연결되었습니다</h1>
      <div class="rule"></div>
      <div class="eyebrow">EXTERNAL POWER LINK · CONNECTED</div>
    </section>
    <section class="message execute">
      <div class="eyebrow">ENERGY TRANSFER SEQUENCE</div>
      <h1>충전 실행</h1>
      <div class="rule"></div>
    </section>
    <section class="system" aria-hidden="true">
      <div class="sigil">
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
          <defs><path id="rune" d="M400 400m-337 0a337 337 0 1 1 674 0a337 337 0 1 1-674 0"/></defs>
          <g class="outer cyan">
            <circle cx="400" cy="400" r="375" stroke-width="2"/><circle cx="400" cy="400" r="360" stroke-width="4" stroke-dasharray="3 13"/>
            <path d="M400 18v72M400 710v72M18 400h72M710 400h72" stroke-width="4"/>
            <text class="runes"><textPath href="#rune">ENERGY LINK · CIRCUIT OPEN · POWER TRANSFER · SYSTEM SYNCHRONIZED · </textPath></text>
          </g>
          <g class="middle gold">
            <circle cx="400" cy="400" r="294" stroke-width="2" stroke-dasharray="34 9 3 9"/>
            <polygon points="400,112 485,315 688,400 485,485 400,688 315,485 112,400 315,315" stroke-width="2"/>
            <polygon points="400,112 485,315 688,400 485,485 400,688 315,485 112,400 315,315" stroke-width="1.5" transform="rotate(45 400 400)"/>
          </g>
          <g class="inner cyan">
            <circle cx="400" cy="400" r="205" stroke-width="5" stroke-dasharray="2 18"/><circle cx="400" cy="400" r="166" stroke-width="2"/>
            <path d="M400 225L552 488H248zM400 575L248 312h304z" stroke-width="2"/>
          </g>
        </svg>
      </div>
      <div class="status">CHARGING CORE · ACTIVE</div>
    </section>
    <section class="complete">에너지 링크 확립<small>CHARGING ACTIVE</small></section>
    <div class="flash"></div>
  </main>
</body>
</html>
