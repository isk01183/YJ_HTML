<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>魔法陣充電演出</title>
  <style>
    :root { color-scheme:dark; --gold:#f7d895; --moon:#fff8df; --violet:#9c76e8; --rose:#c64b70; }
    * { box-sizing:border-box; }
    html:not(.running) *,html:not(.running) *::before,html:not(.running) *::after { animation-play-state:paused!important; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#03020a; }
    body {
      color:var(--moon); font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
      background:
        radial-gradient(ellipse at 50% 48%,rgba(91,48,130,.38) 0,rgba(25,12,43,.42) 30%,transparent 62%),
        radial-gradient(ellipse at 50% 105%,rgba(125,31,65,.22),transparent 48%),
        linear-gradient(180deg,#050411 0%,#0c0718 52%,#03020a 100%);
    }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; box-shadow:inset 0 0 18vmin 5vmin #000; }
    #scene { position:relative; width:100%; height:100%; isolation:isolate; animation:scene 7s linear both; }
    #scene::before {
      content:""; position:absolute; inset:-10%; opacity:.5;
      background-image:
        radial-gradient(circle,rgba(255,244,203,.85) 0 1px,transparent 1.4px),
        radial-gradient(circle,rgba(181,139,242,.7) 0 1px,transparent 1.5px);
      background-position:13px 7px,43px 61px; background-size:97px 89px,137px 131px;
      animation:star-drift 7s ease-out both;
    }
    .mist,.mist::before,.mist::after {
      position:absolute; content:""; width:95vw; height:28vh; border-radius:50%; filter:blur(42px); opacity:.28;
      background:linear-gradient(90deg,transparent,rgba(139,91,183,.55),rgba(179,72,105,.28),transparent);
      animation:mist 7s ease-in-out both;
    }
    .mist { left:-30vw; top:16%; }
    .mist::before { left:45vw; top:42vh; }
    .mist::after { left:4vw; top:68vh; animation-direction:reverse; }
    .crescent {
      position:absolute; left:50%; width:132vw; height:30vh; transform:translateX(-50%); border-radius:50%;
      border:1px solid rgba(247,216,149,.72); box-shadow:0 0 10px rgba(247,216,149,.55),0 0 40px rgba(156,118,232,.35);
      animation:crescent 7s ease both;
    }
    .crescent.top { top:-24vh; }
    .crescent.bottom { bottom:-24vh; }
    .sparks { position:absolute; inset:0; overflow:hidden; }
    .sparks i {
      position:absolute; left:var(--x); top:var(--y); width:var(--s); height:var(--s); border-radius:50%;
      background:var(--gold); box-shadow:0 0 8px var(--gold),0 0 18px var(--rose); opacity:0;
      animation:spark var(--d) ease-in infinite; animation-delay:var(--delay);
    }
    .message { position:absolute; inset:0; display:grid; place-content:center; padding:7vw; text-align:center; }
    .kicker { color:var(--gold); font-size:clamp(12px,3.1vw,19px); letter-spacing:.32em; text-shadow:0 0 14px rgba(247,216,149,.7); }
    .message h1 { margin:.55em 0; font-weight:500; font-size:clamp(31px,8.5vw,70px); line-height:1.45; letter-spacing:.09em; text-shadow:0 0 9px #fff,0 0 28px rgba(156,118,232,.78); }
    .ornament { display:flex; align-items:center; gap:1rem; width:min(76vw,580px); margin:auto; color:var(--gold); }
    .ornament::before,.ornament::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
    .ornament::after { transform:scaleX(-1); }
    .connect { animation:connect 7s ease both; }
    .begin { animation:begin 7s ease both; }
    .begin h1 { font-size:clamp(52px,14vw,112px); letter-spacing:.18em; }
    .ritual { position:absolute; inset:0; display:grid; place-items:center; animation:ritual 7s cubic-bezier(.22,.75,.2,1) both; }
    .magic-circle { position:relative; width:min(96vw,86vh); aspect-ratio:1; filter:drop-shadow(0 0 13px rgba(156,118,232,.55)); }
    .aura { position:absolute; inset:8%; border-radius:50%; background:repeating-conic-gradient(from 3deg,rgba(247,216,149,.18) 0 1deg,transparent 1deg 12deg); mask:radial-gradient(circle,transparent 0 25%,#000 61%,transparent 76%); animation:aura 1.1s ease-in-out infinite alternate; }
    .core { position:absolute; inset:30%; border-radius:50%; background:radial-gradient(circle,var(--moon) 0 2%,var(--gold) 4%,rgba(198,75,112,.55) 14%,rgba(113,71,172,.25) 38%,transparent 68%); animation:core .8s ease-in-out infinite alternate; }
    svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .gold { fill:none; stroke:var(--gold); }
    .violet { fill:none; stroke:#bb9df1; }
    .orbit { transform-origin:400px 400px; animation:orbit 22s linear infinite; }
    .runes { fill:var(--gold); font:500 14px "Yu Mincho",serif; letter-spacing:5px; }
    .seals { transform-origin:400px 400px; animation:seal-breath .9s ease-in-out infinite alternate; }
    .trace { stroke-dasharray:2200; animation:trace 7s ease both; }
    .glyph { fill:var(--moon); font:400 38px "Yu Mincho",serif; text-anchor:middle; dominant-baseline:middle; text-shadow:0 0 10px var(--gold); }
    .phase { position:absolute; left:50%; bottom:7%; transform:translateX(-50%); width:90vw; text-align:center; color:var(--gold); font-size:clamp(11px,2.8vw,17px); letter-spacing:.28em; text-shadow:0 0 12px rgba(247,216,149,.8); }
    .complete { position:absolute; inset:0; display:grid; place-content:center; text-align:center; animation:complete 7s ease both; }
    .complete h2 { margin:0; font-size:clamp(31px,8vw,66px); font-weight:500; letter-spacing:.16em; text-shadow:0 0 8px #fff,0 0 26px var(--violet),0 0 48px var(--rose); }
    .complete p { color:var(--gold); margin:1rem 0 0; letter-spacing:.38em; font-size:clamp(14px,3.3vw,20px); }
    .flare { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 50%,rgba(255,251,226,.95),rgba(186,134,231,.45) 16%,transparent 52%); mix-blend-mode:screen; animation:flare 7s ease-out both; }

    @keyframes connect { 0%{opacity:0;transform:translateY(12px)} 6%,20%{opacity:1;transform:none} 26%,100%{opacity:0;transform:translateY(-8px)} }
    @keyframes begin { 0%,25%{opacity:0;transform:scale(.84)} 30%,38%{opacity:1;transform:none} 43%,100%{opacity:0;transform:scale(1.08)} }
    @keyframes ritual { 0%,40%{opacity:0;transform:scale(.58)} 47%{opacity:1;transform:scale(1)} 79%{opacity:1;transform:scale(1.02)} 86%,100%{opacity:0;transform:scale(1.18)} }
    @keyframes complete { 0%,81%{opacity:0;transform:scale(.82)} 87%,93%{opacity:1;transform:none} 100%{opacity:0;transform:scale(1.05)} }
    @keyframes flare { 0%,79%{opacity:0;transform:scale(.5)} 86%{opacity:.86;transform:scale(1.08)} 92%{opacity:.18} 100%{opacity:0;transform:scale(1.35)} }
    @keyframes scene { 0%,96%{opacity:1} 100%{opacity:0} }
    @keyframes star-drift { from{transform:translateY(0) scale(1);opacity:.28} 82%{opacity:.75} to{transform:translateY(-5vh) scale(1.08);opacity:0} }
    @keyframes mist { 0%{transform:translateX(-8vw) scale(.9)} 50%{opacity:.42} 100%{transform:translateX(34vw) scale(1.2);opacity:.05} }
    @keyframes crescent { 0%{opacity:0} 8%,82%{opacity:.72} 100%{opacity:0;filter:blur(5px)} }
    @keyframes spark { 0%{opacity:0;transform:translateY(8vh) scale(.4)} 25%{opacity:.75} 70%{opacity:.35} 100%{opacity:0;transform:translateY(-18vh) scale(1.25)} }
    @keyframes orbit { to{transform:rotate(360deg)} }
    @keyframes aura { to{opacity:.42;transform:scale(1.04)} }
    @keyframes core { to{transform:scale(1.18);filter:brightness(1.28)} }
    @keyframes seal-breath { to{opacity:.7;filter:drop-shadow(0 0 4px var(--gold))} }
    @keyframes trace { 0%,40%{stroke-dashoffset:2200} 70%,100%{stroke-dashoffset:0} }
    @media (prefers-reduced-motion:reduce) { .orbit,.aura,.core,.seals,.sparks i { animation-play-state:paused; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="充電開始アニメーション">
    <div class="mist"></div><div class="crescent top"></div><div class="crescent bottom"></div>
    <div class="sparks" aria-hidden="true">
      <i style="--x:9%;--y:76%;--s:3px;--d:3.4s;--delay:-1.2s"></i><i style="--x:21%;--y:42%;--s:2px;--d:4.1s;--delay:-.4s"></i>
      <i style="--x:34%;--y:88%;--s:4px;--d:3.7s;--delay:-2s"></i><i style="--x:47%;--y:67%;--s:2px;--d:3.1s;--delay:-.8s"></i>
      <i style="--x:59%;--y:91%;--s:3px;--d:4.4s;--delay:-1.7s"></i><i style="--x:72%;--y:55%;--s:2px;--d:3.3s;--delay:-2.5s"></i>
      <i style="--x:84%;--y:82%;--s:4px;--d:4s;--delay:-.3s"></i><i style="--x:93%;--y:37%;--s:2px;--d:3.6s;--delay:-1.4s"></i>
    </div>

    <section class="message connect">
      <div class="kicker">― 魔力の流入を確認 ―</div>
      <h1>充電端子が<br>接続されました</h1>
      <div class="ornament">◇</div>
    </section>

    <section class="message begin">
      <div class="kicker">― 術式を展開 ―</div>
      <h1>充電開始</h1>
      <div class="ornament">✦</div>
    </section>

    <section class="ritual" aria-hidden="true">
      <div class="magic-circle">
        <div class="aura"></div><div class="core"></div>
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <path id="outerPath" d="M400 400m-346 0a346 346 0 1 1 692 0a346 346 0 1 1-692 0"/>
            <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <g class="orbit gold" filter="url(#glow)">
            <circle cx="400" cy="400" r="376" stroke-width="2"/><circle cx="400" cy="400" r="362" stroke-width="1" stroke-dasharray="3 10"/>
            <text class="runes"><textPath href="#outerPath">古き星の記憶　生命の環　光よ満ちよ　魂の灯火　古き星の記憶　生命の環　</textPath></text>
          </g>
          <g class="gold trace" opacity=".72">
            <circle cx="400" cy="400" r="318" stroke-width="2"/><circle cx="400" cy="400" r="282" stroke-width="1" stroke-dasharray="26 8 2 8"/>
          </g>
          <g class="seals" filter="url(#glow)">
            <g class="gold trace" stroke-width="2">
              <polygon points="400,132 442,298 590,210 502,358 668,400 502,442 590,590 442,502 400,668 358,502 210,590 298,442 132,400 298,358 210,210 358,298"/>
            </g>
            <g class="violet trace" stroke-width="2.5">
              <polygon points="400,188 584,507 216,507"/><polygon points="400,612 216,293 584,293"/>
              <circle cx="400" cy="400" r="174" stroke-width="1.5"/>
            </g>
          </g>
          <g class="glyph">
            <text x="400" y="92">月</text><text x="708" y="400">火</text><text x="400" y="718">星</text><text x="92" y="400">風</text>
          </g>
        </svg>
      </div>
      <div class="phase">魔力回路　接続中</div>
    </section>

    <section class="complete"><div><h2>魔力回路</h2><p>接続完了</p></div></section>
    <div class="flare"></div>
  </main>
  <script>window.startChargingAnimation=()=>document.documentElement.classList.add("running");</script>
</body>
</html>
