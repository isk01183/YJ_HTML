<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data: https://appassets.androidplatform.net;">
<title>魔法陣の書庫</title>
<style>
  :root{color-scheme:dark;--ink:#f7d895;--accent:#bb9df1;--surface:#101318;--muted:#a5aaaF}
  *{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f0ebe0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #e8ce9b;outline-offset:4px}button:disabled{cursor:default}
  .page{max-width:1020px;margin:auto;padding:28px 20px 142px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-size:10px;letter-spacing:.22em;color:#bdac8d}.settings{background:none;border:1px solid #363a3f;border-radius:24px;padding:9px 13px;font-size:11px;min-height:48px}
  h1{font-family:'Yu Mincho','Noto Serif JP',serif;font-size:30px;letter-spacing:.09em;font-weight:400;margin:23px 0 10px}
  .intro{font-size:12px;color:var(--muted);line-height:1.9;margin:0}.statusline{display:flex;align-items:center;gap:7px;font-size:10px;color:#aeb6b8;margin:15px 0 20px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%;background:#d1a465}.enabled .dot{background:#a9d8bf}.statusline .sep{color:#4a4e55;padding:0 3px}
  .hero{background:radial-gradient(ellipse at 20% 50%,#c18eac0c,transparent 70%),#0d1015;border:1px solid #303039;border-radius:18px;display:grid;grid-template-columns:44% 1fr;align-items:center;padding:16px 13px;gap:14px;overflow:hidden;min-height:204px}
  #hero-art{width:100%;max-width:240px;justify-self:center;aspect-ratio:1}.circle-svg{display:block;width:100%;height:100%}.hero .label{font-size:9px;letter-spacing:.2em;color:var(--ink);line-height:1.6}.hero h2{font:400 clamp(19px,4.8vw,28px)/1.5 'Yu Mincho',serif;letter-spacing:.05em;margin:8px 0 9px}.hero p{font-size:11px;line-height:1.9;color:#b3b2b2;margin:0}.saved{margin-top:12px;color:var(--ink);font-size:10px;min-height:18px}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:27px 0 14px}.section-head h2{font-size:14px;font-weight:500;letter-spacing:.08em;margin:0}.count{font-size:10px;letter-spacing:.16em;color:#969ca5}
  .tabs{display:flex;gap:8px;margin-bottom:13px;overflow:auto;padding:2px}.tab{border:1px solid #2e3137;border-radius:24px;min-height:48px;white-space:nowrap;padding:9px 14px;background:none;color:#aeb3bb;font-size:11px}.tab[aria-pressed=true]{background:#29251e;color:#f2dfba;border-color:#65553d}.tab.add{border-style:dashed;color:#e6d2ac}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;background:#0d1015;border:1px solid #272b33;border-radius:14px;padding:9px 10px 13px;text-align:left;overflow:hidden;transition:border-color .15s,background .15s}.card[aria-pressed=true]{border-color:var(--ink);background:#15161b}.card .art{width:100%;aspect-ratio:1;background:radial-gradient(ellipse,#ffffff04,transparent 65%)}.card .name{display:block;font-size:12px;font-weight:500;margin:9px 0 5px;letter-spacing:.03em}.card .tag{display:block;color:#9297a1;font-size:8px;letter-spacing:.12em}.check{position:absolute;right:10px;top:10px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1px solid #555862;background:#101318;color:transparent;font-size:12px}.card[aria-pressed=true] .check{color:#0c1013;background:var(--ink);border-color:var(--ink)}.applied-badge{position:absolute;left:10px;top:11px;color:#d8cbaF;font-size:8px;background:#11161dd9;border-radius:10px;padding:3px 6px}.card[hidden]{display:none}
  .note{font-size:10px;color:#9097a1;line-height:1.9;margin:22px 0 0}.actions{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #323238;background:#0e1117f5;backdrop-filter:blur(14px);padding:11px 20px max(16px,env(safe-area-inset-bottom));z-index:5}.action-inner{max-width:980px;margin:auto}.action-label{font-size:10px;color:#bdc0c3;margin-bottom:10px;min-height:15px}.buttons{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.buttons button{min-height:48px;border-radius:9px;border:1px solid #43464e;background:transparent;font-size:12px}.buttons .apply{background:#eddbb6;color:#181613;border-color:#eddbb6;font-weight:600}.buttons .apply:disabled{background:#34312b;border-color:#484037;color:#d6c7a7}
  .hint{font-size:11px;line-height:1.8;color:#dbcaa9;border-left:2px solid #a08858;padding-left:12px;margin:14px 0 0}.hint[hidden]{display:none}
  dialog{border:1px solid #63573e;border-radius:12px;padding:0;background:#030507;color:#f4e7cd;width:min(420px,96vw);height:94vh;max-height:94vh;overflow:hidden}dialog::backdrop{background:#000b}dialog iframe{border:0;width:100%;height:100%}.close{position:absolute;top:10px;right:10px;z-index:1;background:#191b22c9;color:#fff;border:1px solid #6d6d76;border-radius:24px;min-height:48px;padding:9px 16px}
  @media(min-width:640px){.page{padding-top:38px}.hero{grid-template-columns:260px 1fr;gap:36px;padding:20px 36px}.hero h2{font-size:31px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:37px}.hero .label{font-size:11px}.card .name{font-size:13px}}
  @media(max-width:340px){.page{padding-left:13px;padding-right:13px}.hero{gap:9px;padding:13px 9px}.hero h2{font-size:18px}.hero p{font-size:10px}.tabs{gap:5px}.tab{padding:7px 10px}}
  .languages{display:flex;align-items:center;gap:5px;margin:20px 0 0;flex-wrap:wrap}.languages>span{font-size:10px;color:#a5aaaf;margin-right:auto}.languages button{border:1px solid #333943;background:#10151c;min-height:48px;padding:8px 12px;border-radius:7px;font-size:11px}.languages button[aria-pressed=true]{border-color:#bdac8d;background:#28251f;color:#f6e2bb}
  [data-i18n]{white-space:pre-line}.art img{width:100%;height:100%;display:block}.search{width:100%;min-height:44px;border:1px solid #353944;background:#0c1016;border-radius:9px;padding:11px 14px;color:#eee4d3;font:inherit;font-size:12px;margin-bottom:17px}.search:focus{outline:2px solid #bdac8d;outline-offset:2px}.empty{color:#a6aab2;font-size:13px;text-align:center;padding:24px}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  .library-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 8px;padding:17px;border:1px solid #37362f;border-radius:13px;background:linear-gradient(120deg,#211e184f,#10151b)}
  .library-copy{flex:1;min-width:130px}.library-copy strong{display:block;font-size:13px;font-weight:500;color:#e8ddc6}.library-copy p{font-size:10px;line-height:1.7;color:#a5aaaf;margin:6px 0 0}
  .library-tools button,.manage button{border:1px solid #514b3f;background:#26221b;color:#f2dfba;min-height:48px;border-radius:9px;padding:10px 14px;font-size:11px}
  button:disabled{opacity:.55}.manage{display:flex;justify-content:flex-end;gap:10px;margin:13px 0 0;flex-wrap:wrap}.manage button{background:transparent;border-color:#363a42;color:#b7bbc4}.manage #delete-design{color:#dfb2ad}
  .manage [hidden]{display:none}.card .art img,#hero-art img{object-fit:contain;width:100%;height:100%;border-radius:7px}.card .name,#hero-title{overflow-wrap:anywhere}.empty-art{display:grid;place-items:center;height:100%;color:#857c69;font:200 52px/1 serif}
  .tab-actions{display:flex;justify-content:flex-end;gap:8px;margin:0 0 17px;flex-wrap:wrap}.tab-actions[hidden]{display:none}.tab-actions button{min-height:48px;border:1px solid #363a42;border-radius:9px;background:#11151b;padding:9px 13px;font-size:11px}.tab-actions .danger{color:#dfb2ad}
  .library-dialog{height:min(760px,94vh);width:min(760px,96vw);padding:20px;overflow:auto}.library-dialog h2{font:400 21px/1.4 'Yu Mincho',serif;margin:3px 58px 8px 0}.library-dialog .dialog-copy{color:#aeb2b8;font-size:11px;line-height:1.7;margin:0 58px 18px 0}.library-dialog .search{margin-bottom:14px}.library-dialog .grid{padding-bottom:10px}.inactive-card{display:block}.inactive-card .enable,.member-row button,.dialog-actions button{width:100%;min-height:48px;margin-top:10px;border:1px solid #514b3f;background:#26221b;color:#f2dfba;border-radius:9px;padding:10px;font-size:11px}.inactive-card .check{display:none}
  .field-label{display:block;font-size:11px;color:#c8c1b5;margin:20px 0 8px}.field{width:100%;min-height:48px;border:1px solid #414650;border-radius:9px;background:#0c1016;color:#f0ebe0;padding:10px 12px;font:inherit}.field:focus{outline:2px solid #bdac8d;outline-offset:2px}.form-error{min-height:20px;color:#e5aaa2;font-size:11px;margin:8px 0}.dialog-actions{display:flex;gap:10px}.dialog-actions button{width:auto;flex:1}.dialog-actions .primary{background:#eddbb6;color:#181613}.member-list{display:grid;gap:8px}.member-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1px solid #292e36;border-radius:10px;padding:9px 11px}.member-row span{min-width:0;font-size:11px;overflow-wrap:anywhere}.member-row button{width:auto;min-width:86px;margin:0}.member-row button[aria-pressed=true]{background:#3d3525;border-color:#8c744d}.notice{font-size:11px;line-height:1.7;color:#ead3a5;border:1px solid #594b33;border-radius:9px;padding:10px 12px;margin:14px 0}.notice[hidden]{display:none}
</style>
</head>
<body>
<main class="page">
  <div class="masthead"><span class="brand" data-i18n="brand"></span><button id="settings" class="settings" data-i18n="settings"></button></div>
  <div class="languages" role="group" data-i18n-label="language"><span data-i18n="language"></span><button data-language="ko" lang="ko" aria-pressed="false">한국어</button><button data-language="ja" lang="ja" aria-pressed="false">日本語</button><button data-language="en" lang="en" aria-pressed="false">English</button></div>
  <h1 data-i18n="galleryTitle"></h1><p class="intro" data-i18n="intro"></p>
  <div class="statusline" id="service-state"><i class="dot"></i><span id="service-label"></span><span class="sep">/</span><span data-i18n="maxTime"></span><span class="sep">/</span><span data-i18n="offline"></span></div>
  <section class="hero" data-i18n-label="selectedCircle"><div id="hero-art"></div><div><div class="label" id="hero-tag"></div><h2 id="hero-title"></h2><p id="hero-description"></p><div class="saved" id="hero-saved"></div></div></section>
  <p id="service-hint" class="hint" hidden data-i18n="serviceHint"></p><p id="library-notice" class="notice" hidden></p>
  <div class="manage"><button id="delete-design" data-i18n="disableDesign"></button></div>
  <section class="library-tools"><div class="library-copy"><strong data-i18n="yourMedia"></strong><p data-i18n="mediaHint"></p></div><button id="import-media" data-i18n="importMedia" disabled></button><button id="manage-inactive" data-i18n="manageInactive"></button></section>
  <div class="section-head"><h2 data-i18n="choose"></h2><span class="count" id="design-count"></span></div>
  <nav class="tabs" id="gallery-tabs" data-i18n-label="categories"><button class="tab" data-group="all" aria-pressed="true"></button><button class="tab add" id="create-tab" data-i18n="createTab"></button></nav>
  <div class="tab-actions" id="tab-actions" hidden><button id="manage-tab-members" data-i18n="manageTabMembers"></button><button id="rename-tab" data-i18n="renameTab"></button><button id="delete-tab" class="danger" data-i18n="deleteTab"></button></div>
  <input id="search" class="search" type="search" autocomplete="off" data-i18n-label="search">
  <div class="grid" id="design-grid"></div><p class="empty" id="empty" hidden data-i18n="noResults"></p><p class="note" data-i18n="note"></p>
</main>
<footer class="actions"><div class="action-inner"><div class="action-label" id="selection-status" aria-live="polite"></div><div class="buttons"><button id="preview" data-i18n="preview"></button><button class="apply" id="apply"></button></div></div></footer>
<dialog id="browser-preview"><button class="close" id="close-preview" data-i18n="close"></button><iframe title="Magic circle preview"></iframe></dialog>
<dialog id="inactive-dialog" class="library-dialog" data-i18n-label="manageInactive"><button class="close" id="close-inactive" data-i18n="close"></button><h2 data-i18n="manageInactive"></h2><p class="dialog-copy" data-i18n="inactiveHint"></p><input id="inactive-search" class="search" type="search" autocomplete="off" data-i18n-label="inactiveSearch"><div class="grid" id="inactive-grid"></div><p class="empty" id="inactive-empty" hidden data-i18n="noResults"></p></dialog>
<dialog id="tab-editor" class="library-dialog" data-i18n-label="tabEditor"><button class="close" id="close-tab-editor" data-i18n="close"></button><h2 id="tab-editor-title"></h2><label class="field-label" for="tab-name" data-i18n="tabName"></label><input id="tab-name" class="field" autocomplete="off"><p class="form-error" id="tab-error" role="alert"></p><div class="dialog-actions"><button id="cancel-tab-editor" data-i18n="cancel"></button><button id="save-tab" class="primary" data-i18n="save"></button></div></dialog>
<dialog id="tab-members-dialog" class="library-dialog" data-i18n-label="tabMembers"><button class="close" id="close-tab-members" data-i18n="close"></button><h2 data-i18n="tabMembers"></h2><p class="dialog-copy" data-i18n="tabMembersHint"></p><div class="member-list" id="tab-members-grid"></div></dialog>
<script src="i18n.js"></script>
<script src="circle-designs.js"></script>
<script src="collection-catalog.js"></script>
<script src="direct-extra.js"></script><script src="direct-circles.js"></script>
<script src="gallery.js"></script>
</body>
</html>
