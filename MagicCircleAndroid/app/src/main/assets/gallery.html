<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data:;">
<title>魔法陣の書庫</title>
<style>
  :root{color-scheme:dark;--ink:#f7d895;--accent:#bb9df1;--surface:#101318;--muted:#a5aaaF}
  *{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f0ebe0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #e8ce9b;outline-offset:4px}button:disabled{cursor:default}
  .page{max-width:1020px;margin:auto;padding:28px 20px 142px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-size:10px;letter-spacing:.22em;color:#bdac8d}.settings{background:none;border:1px solid #363a3f;border-radius:20px;padding:9px 13px;font-size:11px;min-height:40px}
  h1{font-family:'Yu Mincho','Noto Serif JP',serif;font-size:30px;letter-spacing:.09em;font-weight:400;margin:23px 0 10px}
  .intro{font-size:12px;color:var(--muted);line-height:1.9;margin:0}.statusline{display:flex;align-items:center;gap:7px;font-size:10px;color:#aeb6b8;margin:15px 0 20px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%;background:#d1a465}.enabled .dot{background:#a9d8bf}.statusline .sep{color:#4a4e55;padding:0 3px}
  .hero{background:radial-gradient(ellipse at 20% 50%,#c18eac0c,transparent 70%),#0d1015;border:1px solid #303039;border-radius:18px;display:grid;grid-template-columns:44% 1fr;align-items:center;padding:16px 13px;gap:14px;overflow:hidden;min-height:204px}
  #hero-art{width:100%;max-width:240px;justify-self:center;aspect-ratio:1}.circle-svg{display:block;width:100%;height:100%}.hero .label{font-size:9px;letter-spacing:.2em;color:var(--ink);line-height:1.6}.hero h2{font:400 clamp(19px,4.8vw,28px)/1.5 'Yu Mincho',serif;letter-spacing:.05em;margin:8px 0 9px}.hero p{font-size:11px;line-height:1.9;color:#b3b2b2;margin:0}.saved{margin-top:12px;color:var(--ink);font-size:10px;min-height:18px}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:27px 0 14px}.section-head h2{font-size:14px;font-weight:500;letter-spacing:.08em;margin:0}.count{font-size:10px;letter-spacing:.16em;color:#969ca5}
  .tabs{display:flex;gap:8px;margin-bottom:17px;overflow:auto;padding:2px}.tab{border:1px solid #2e3137;border-radius:18px;min-height:38px;white-space:nowrap;padding:7px 13px;background:none;color:#aeb3bb;font-size:11px}.tab[aria-pressed=true]{background:#29251e;color:#f2dfba;border-color:#65553d}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;background:#0d1015;border:1px solid #272b33;border-radius:14px;padding:9px 10px 13px;text-align:left;overflow:hidden;transition:border-color .15s,background .15s}.card[aria-pressed=true]{border-color:var(--ink);background:#15161b}.card .art{width:100%;aspect-ratio:1;background:radial-gradient(ellipse,#ffffff04,transparent 65%)}.card .name{display:block;font-size:12px;font-weight:500;margin:9px 0 5px;letter-spacing:.03em}.card .tag{display:block;color:#9297a1;font-size:8px;letter-spacing:.12em}.check{position:absolute;right:10px;top:10px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1px solid #555862;background:#101318;color:transparent;font-size:12px}.card[aria-pressed=true] .check{color:#0c1013;background:var(--ink);border-color:var(--ink)}.applied-badge{position:absolute;left:10px;top:11px;color:#d8cbaF;font-size:8px;background:#11161dd9;border-radius:10px;padding:3px 6px}.card[hidden]{display:none}
  .note{font-size:10px;color:#9097a1;line-height:1.9;margin:22px 0 0}.actions{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #323238;background:#0e1117f5;backdrop-filter:blur(14px);padding:11px 20px max(16px,env(safe-area-inset-bottom));z-index:5}.action-inner{max-width:980px;margin:auto}.action-label{font-size:10px;color:#bdc0c3;margin-bottom:10px;min-height:15px}.buttons{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}.buttons button{min-height:46px;border-radius:9px;border:1px solid #43464e;background:transparent;font-size:12px}.buttons .apply{background:#eddbb6;color:#181613;border-color:#eddbb6;font-weight:600}.buttons .apply:disabled{background:#34312b;border-color:#484037;color:#d6c7a7}
  .hint{font-size:11px;line-height:1.8;color:#dbcaa9;border-left:2px solid #a08858;padding-left:12px;margin:14px 0 0}.hint[hidden]{display:none}
  dialog{border:1px solid #63573e;border-radius:12px;padding:0;background:#030507;color:#f4e7cd;width:min(420px,96vw);height:94vh;max-height:94vh;overflow:hidden}dialog::backdrop{background:#000b}dialog iframe{border:0;width:100%;height:100%}.close{position:absolute;top:10px;right:10px;z-index:1;background:#191b22c9;color:#fff;border:1px solid #6d6d76;border-radius:20px;min-height:40px;padding:7px 14px}
  @media(min-width:640px){.page{padding-top:38px}.hero{grid-template-columns:260px 1fr;gap:36px;padding:20px 36px}.hero h2{font-size:31px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:37px}.hero .label{font-size:11px}.card .name{font-size:13px}}
  @media(max-width:340px){.page{padding-left:13px;padding-right:13px}.hero{gap:9px;padding:13px 9px}.hero h2{font-size:18px}.hero p{font-size:10px}.tabs{gap:5px}.tab{padding:7px 10px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="masthead"><span class="brand">ARCANE / COLLECTION</span><button id="settings" class="settings">接続設定 ↗</button></div>
  <h1>魔法陣の書庫</h1><p class="intro">充電のひとときに、あなたの術式を。<br>好きな魔法陣を選んで、光の演出をお楽しみください。</p>
  <div class="statusline" id="service-state"><i class="dot"></i><span id="service-label">アプリで接続設定を確認</span><span class="sep">/</span><span>最大7秒</span><span class="sep">/</span><span>オフライン</span></div>
  <section class="hero" aria-label="選択した魔法陣"><div id="hero-art"></div><div><div class="label" id="hero-tag"></div><h2 id="hero-title"></h2><p id="hero-description"></p><div class="saved" id="hero-saved"></div></div></section>
  <p id="service-hint" class="hint" hidden>充電時の表示には、ユーザー補助サービスを有効にしてください。上の「接続設定」から設定できます。</p>
  <div class="section-head"><h2>術式を選ぶ</h2><span class="count">13 DESIGNS</span></div>
  <nav class="tabs" aria-label="デザインの分類"><button class="tab" data-group="all" aria-pressed="true">すべて</button><button class="tab" data-group="signature" aria-pressed="false">代表作 · 4</button><button class="tab" data-group="variation" aria-pressed="false">変奏 · 8</button><button class="tab" data-group="classic" aria-pressed="false">従来</button></nav>
  <div class="grid" id="design-grid"></div><p class="note">中央の星形は回転しません。動きのある術式は、外周のルーン環と光の軌道だけがゆっくり巡ります。<br>端子を外すと終了し、再接続すると最初から再生します。</p>
</main>
<footer class="actions"><div class="action-inner"><div class="action-label" id="selection-status" aria-live="polite"></div><div class="buttons"><button id="preview">▷ 7秒プレビュー</button><button class="apply" id="apply">この魔法陣を適用</button></div></div></footer>
<dialog id="browser-preview"><button class="close" id="close-preview">閉じる ×</button><iframe title="魔法陣プレビュー"></iframe></dialog>
<script src="circle-designs.js"></script>
<script>
  let selected='classic', focused='classic', native=false, initialized=false, activeGroup='all';
  const grid=document.getElementById('design-grid');
  grid.innerHTML=CircleDesigns.list.map(t=>'<button type="button" class="card" data-theme="'+t.id+'" aria-pressed="false" aria-label="'+t.name+'を選択"><span class="check">✓</span><span class="applied-badge" hidden>適用中</span><div class="art">'+CircleDesigns.svg(t.id,'card-'+t.id)+'</div><span class="name">'+t.name+'</span><span class="tag">'+t.tag+'</span></button>').join('');
  function render(){
    const t=CircleDesigns.get(focused);
    document.documentElement.style.setProperty('--ink',t.color);
    document.getElementById('hero-art').innerHTML=CircleDesigns.svg(t.id,'hero');
    document.getElementById('hero-tag').textContent=t.tag;
    document.getElementById('hero-title').textContent=t.name;
    document.getElementById('hero-description').textContent=t.desc;
    document.getElementById('hero-saved').textContent=focused===selected?'✓ 適用中の魔法陣':'選択中 · 適用すると次の充電から反映';
    document.getElementById('selection-status').textContent='適用中：'+CircleDesigns.get(selected).name;
    document.getElementById('apply').disabled=focused===selected;
    document.getElementById('apply').textContent=focused===selected?'✓ 適用済み':'この魔法陣を適用';
    document.querySelectorAll('.card').forEach(card=>{
      card.setAttribute('aria-pressed',String(card.dataset.theme===focused));
      card.querySelector('.applied-badge').hidden=card.dataset.theme!==selected;
      card.hidden=activeGroup!=='all'&&CircleDesigns.get(card.dataset.theme).group!==activeGroup;
    });
  }
  window.setGalleryState=state=>{
    native=true;selected=CircleDesigns.get(state.selected).id;
    if(!initialized){focused=selected;initialized=true;}
    document.getElementById('service-label').textContent=state.enabled?'充電アニメーション：有効':'充電アニメーション：無効';
    document.getElementById('service-state').classList.toggle('enabled',!!state.enabled);
    document.getElementById('service-hint').hidden=!!state.enabled;
    render();
  };
  grid.addEventListener('click',event=>{const card=event.target.closest('[data-theme]');if(card){focused=card.dataset.theme;render();}});
  document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{activeGroup=button.dataset.group;document.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));render();}));
  document.getElementById('apply').addEventListener('click',()=>{
    if(native)location.href='magiccircle://select?theme='+encodeURIComponent(focused);
    else{selected=focused;render();document.getElementById('selection-status').textContent='ブラウザ確認用 · アプリへの保存は行われません';}
  });
  const dialog=document.getElementById('browser-preview');let timer;
  function closePreview(){clearTimeout(timer);dialog.close();dialog.querySelector('iframe').src='about:blank';}
  dialog.addEventListener('cancel',()=>{clearTimeout(timer);dialog.querySelector('iframe').src='about:blank';});
  document.getElementById('close-preview').addEventListener('click',closePreview);
  document.getElementById('preview').addEventListener('click',()=>{
    if(native){location.href='magiccircle://preview?theme='+encodeURIComponent(focused);return;}
    const file=focused==='classic'?'magic_circle.html':'theme_circle.html';
    dialog.querySelector('iframe').src=file+'?theme='+focused+'&demo=1';dialog.showModal();timer=setTimeout(closePreview,7400);
  });
  document.getElementById('settings').addEventListener('click',()=>{
    if(native)location.href='magiccircle://settings';else document.getElementById('selection-status').textContent='接続設定はAndroidアプリで開いてください';
  });
  render();
</script>
</body>
</html>
